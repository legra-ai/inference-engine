[package]
name = "inference-engine-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
inference-engine = { path = "../.." }
napi = { version = "=3.16.1", default-features = false, features = ["napi6"] }
napi-derive = "=3.7.0"
serde_json = "1"

[build-dependencies]
napi-build = "=2.6.0"
