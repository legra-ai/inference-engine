[workspace]
members = ["bindings/python", "bindings/node"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/inference-engine"

[package]
name = "inference-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust inference foundation with checked RDF rule-profile compilation"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
readme = "README.md"
documentation = "https://docs.rs/inference-engine"
keywords = ["rdf", "rdfs", "owl", "datalog", "reasoning"]
categories = ["science", "data-structures"]
build = "build.rs"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "build_support.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**/*.rs", "tests/**", "docs/rdfs-subclass.md", "docs/rdfs-source.md", "docs/rdfs-context.md", "docs/shacl12.md", "docs/rdfs-targets.md"]

[dependencies]
datalog-structural-model = "=3.0.5"
rdf-reasoning = "=2.17.0"
rdf-structural-model = "=0.4.0"
serde = { version = "1", features = ["derive"] }
shacl-structural-model = "=6.4.7"

[build-dependencies]
rhusky = "=2.0.12"
toml = "1.2.1"

[dev-dependencies]
iri-rfc3987 = "=0.3.0"
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "fs"] }
oxttl = { version = "=0.2.5", features = ["rdf-12"] }
oxrdf = { version = "=0.3.5", features = ["rdf-12"] }
sha2 = "0.11"
toml = "1.2.1"
oxigraph = { version = "=0.5.13", default-features = false, features = ["rdf-12"] }

[package.metadata.version-info]
pre_bump_hooks = ["python3 scripts/sync-version.py {{version}}"]
additional_files = ["package.json", "package-lock.json"]

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
