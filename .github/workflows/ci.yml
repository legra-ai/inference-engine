name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash {0}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        if: github.ref == 'refs/heads/main'
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        id: release
        with:
          token: ${{ steps.writer.outputs.token || github.token }}
      - name: Require explicit alpha identity
        run: python3 scripts/release-version.py

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-11-08
          components: rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          components: clippy
      - run: python3 scripts/test-release.py
      - run: python3 scripts/test-workflow.py
      - run: python3 scripts/release-version.py
      - run: ./scripts/fmt.sh --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
      - uses: legra-ai/github-actions/.github/actions/test-cargo-package@6f16eabc5fdb3f8ad66c4b073157414890ecfd98

  sdist:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: uv build --sdist --out-dir dist
      - run: python3 scripts/check-package.py dist/*.tar.gz
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  native:
    needs: [prepare, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: cargo test --locked --workspace
      - run: python3 scripts/build-node.py
      - run: npm test
      - run: python3 scripts/test-npm-package.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-sdist
          path: source-dist
      - name: Extract verified source distribution
        run: |
          mkdir source-build || exit 1
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-build || exit 1
      - name: Build manylinux wheel from source distribution
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          working-directory: source-build
          args: --release --locked --out ../dist --interpreter python3.13
      - name: Build macOS or Windows wheel from source distribution
        if: runner.os != 'Linux'
        run: uv build --wheel --out-dir dist -C 'maturin.build-args=--locked' source-dist/*.tar.gz
      - run: python3 scripts/check-package.py dist/*.whl
      - run: uvx --from twine==7.0.0 twine check --strict dist/*.whl
      - name: Test installed wheel outside the checkout
        run: python3 scripts/test-wheel.py
      - name: Stage flat native artifact inventory
        run: |
          mkdir release-native || exit 1
          cp dist/*.whl ./*.node release-native/ || exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-native-${{ matrix.target }}
          path: release-native/*
          if-no-files-found: error

  test:
    if: always()
    needs: [prepare, verify, sdist, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation and platform artifact
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          failed = {name: value['result'] for name, value in json.loads(os.environ['RESULTS']).items() if value['result'] != 'success'}
          if failed:
              raise RuntimeError(f'Required release gates failed: {failed}')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check complete publication inventory before tagging
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release-packages.py check-build

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          token: ${{ steps.writer.outputs.token }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: python3 scripts/release-version.py
      - uses: legra-ai/github-actions/.github/actions/tag-tested-release@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.writer.outputs.token }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          draft: true
          prerelease: true
          generate_release_notes: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Retain or restore immutable original packages
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 scripts/release-packages.py stage
      - uses: legra-ai/github-actions/.github/actions/publish-tested-crate@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        with:
          crate: inference-engine
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - id: npm
        run: python3 scripts/release-packages.py check-npm
      - name: Publish original npm archive through trusted publishing
        if: steps.npm.outputs.npm_missing == 'true'
        env:
          NPM_ARCHIVE: ${{ steps.npm.outputs.npm_archive }}
        run: npm publish "$GITHUB_WORKSPACE/$NPM_ARCHIVE" --tag alpha --access public --provenance --ignore-scripts
      - uses: legra-ai/github-actions/.github/actions/verify-registry-publication@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        with:
          registry: npm
          package: inference-engine
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          archive: release-packages.zip
      - id: python
        run: python3 scripts/release-packages.py filter-python
      - if: steps.python.outputs.python_missing == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pending-packages/
      - uses: legra-ai/github-actions/.github/actions/verify-registry-publication@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        with:
          registry: pypi
          package: inference-engine
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          archive: release-packages.zip
      - run: python3 scripts/release-packages.py verify-python
      - name: Complete only after every registry is publicly verified
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false --prerelease
