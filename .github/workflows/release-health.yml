name: Release health
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: release-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: legra-ai/github-actions/.github/actions/monitor-release@7161b3b0fb80eb36ff9d92faccfced2a8001fe40
        with:
          config: .github/release-health.json
          token: ${{ github.token }}
