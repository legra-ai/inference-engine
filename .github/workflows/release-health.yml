name: Release health
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: release-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: legra-ai/github-actions/.github/actions/monitor-release@6f16eabc5fdb3f8ad66c4b073157414890ecfd98
        with:
          config: .github/release-health.json
          token: ${{ github.token }}
